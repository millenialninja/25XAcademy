<!doctype html><html><head><meta charset="utf-8">
<!-- One case-study card, 1080x1350. The card data comes in the URL hash as JSON
     (one entry of case-studies.ts). Rendered to ../../website/case-study-images/. -->
<style>
@font-face{font-family:B;src:url(../public/fonts/bricolage-grotesque-normal.woff2) format('woff2');font-weight:400 800}
@font-face{font-family:B;src:url(../public/fonts/bricolage-grotesque-normal-ext.woff2) format('woff2');font-weight:400 800;unicode-range:U+0100-02BA,U+20A0-20AB,U+20AD-20C0}
@font-face{font-family:I;src:url(../public/fonts/inter-normal.woff2) format('woff2');font-weight:400 700}
@font-face{font-family:I;src:url(../public/fonts/inter-normal-ext.woff2) format('woff2');font-weight:400 700;unicode-range:U+0100-02BA,U+20A0-20AB,U+20AD-20C0}
:root{--a:#FF7A1A}
.saffron{--a:#FF7A1A}.lilac{--a:#B9A6FF}.mint{--a:#4FD1A5}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{background:#0B0B12;color:#F6F1E7;font-family:I;position:relative}
.g{position:absolute;width:900px;height:900px;right:-360px;top:-380px;border-radius:50%;background:radial-gradient(circle,var(--a) 0%,transparent 64%);filter:blur(70px);opacity:.5}
.lines{position:absolute;inset:0;background-image:linear-gradient(rgba(246,241,231,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(246,241,231,.06) 1px,transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse at 80% 10%,#000,transparent 70%)}
.x{position:absolute;right:96px;top:96px;width:150px;height:150px}
.x i{position:absolute;left:-15%;top:calc(50% - 5px);width:130%;height:10px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--a) 20%,#fff 50%,var(--a) 80%,transparent);box-shadow:0 0 24px 6px color-mix(in srgb,var(--a) 55%,transparent)}
.x i:first-child{transform:rotate(45deg)}.x i:last-child{transform:rotate(-45deg)}
.c{position:absolute;inset:88px 88px 88px;display:flex;flex-direction:column}
.lbl{font:600 22px I;letter-spacing:.14em;text-transform:uppercase;color:#A8A5B6}
.tool{display:flex;align-items:center;gap:18px}
.chip{font:700 28px I;padding:12px 26px;border-radius:99px;background:rgba(246,241,231,.1);box-shadow:inset 0 0 0 1.5px rgba(246,241,231,.18)}
h1{font:800 132px/0.95 B;letter-spacing:-.035em;margin:120px 0 0;max-width:900px}
.what{font:400 44px/1.3 I;color:#D9D5E3;margin:28px 0 0;max-width:860px}
.what::first-letter{text-transform:uppercase}
.res{margin-top:auto;padding:52px 56px;border-radius:40px;background:rgba(246,241,231,.06);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--a) 45%,transparent)}
.big{font:800 168px/0.95 B;letter-spacing:-.035em;color:var(--a);margin:20px 0 0}
.big.m{font-size:124px}.big.l{font-size:92px;line-height:1.02;letter-spacing:-.025em}
.rest{font:500 44px/1.25 I;margin:16px 0 0}
.who{margin-top:52px;padding-top:40px;border-top:1.5px solid rgba(246,241,231,.14);font:400 36px/1.35 I;color:#D9D5E3}
.who b{font-weight:700;color:#F6F1E7}
</style></head><body>
<div class="g"></div><div class="lines"></div><div class="x"><i></i><i></i></div>
<div class="c">
  <div class="tool"><span class="lbl">Tool</span><span class="chip" id="tool"></span></div>
  <h1 id="product"></h1>
  <p class="what" id="what"></p>
  <div class="res">
    <div class="lbl">Result (as reported)</div>
    <div class="big" id="big"></div>
    <div class="rest" id="rest"></div>
  </div>
  <div class="who" id="who"></div>
</div>
<script>
  var d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.body.className = d.accent;
  ['tool', 'product', 'what', 'big', 'rest'].forEach(function (k) { document.getElementById(k).textContent = d[k]; });
  document.getElementById('who').innerHTML = d.who;
  var big = document.getElementById('big');
  if (d.big.length > 11) big.classList.add('l'); else if (d.big.length > 6) big.classList.add('m');
</script>
</body></html>
